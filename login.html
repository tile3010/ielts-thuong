<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · IELTS</title><link rel="icon" href="/icons/icon-192.png"><link rel="manifest" href="/manifest.webmanifest"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f7f4;font:16px system-ui;color:#173e33}main{background:white;border-radius:24px;padding:32px;max-width:360px;width:calc(100% - 96px)}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 16px;border-radius:10px;border:1px solid #bacfc4;font:inherit}button{background:#166b58;color:white}#error{color:#a32222}</style><main><h1>Không gian học của bạn</h1><p>Đăng nhập bằng tài khoản do chủ trang cấp.</p><form id="login"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required></label><button>Đăng nhập</button><p id="error" role="alert"></p></form><p>Chưa có tài khoản hoặc quên mật khẩu? Liên hệ chủ trang.</p></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;button.textContent='Đang đăng nhập…';document.getElementById('error').textContent='';e.target.setAttribute('aria-busy','true');try{const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const result=await response.json();if(!response.ok)throw Error(result.error);location.replace('/')}catch(error){document.getElementById('error').textContent=error.message}finally{button.disabled=false;button.textContent='Đăng nhập';e.target.removeAttribute('aria-busy')}}</script></html>
