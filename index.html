<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f7f6" />
  <title>Thương IELTS — Học theo nhịp của bạn</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">T</div><div class="brand-copy"><strong>Thương IELTS</strong><small>Study space · band 3.5 → 5.5</small></div></div>
    <div><div class="nav-label">Không gian học</div><nav class="nav" id="nav">
      <button data-page="home" class="active"><span class="nav-icon">⌂</span><span class="nav-text">Tổng quan</span></button>
      <button data-page="practice"><span class="nav-icon">◷</span><span class="nav-text">Buổi học hôm nay</span></button>
      <button data-page="progress"><span class="nav-icon">↗</span><span class="nav-text">Tiến độ</span></button>
      <button data-page="settings"><span class="nav-icon">⚙</span><span class="nav-text">Cá nhân hóa</span></button>
    </nav></div>
    <div class="side-bottom"><div class="goal-card"><small>Mục tiêu hiện tại</small><strong id="sideGoal">Band 5.5</strong><p>Tiến từng bước nhỏ, học đều mỗi tối.</p></div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="crumb" id="crumb">Không gian học <span style="color:#b2bcb7"> / </span> Tổng quan</div><div class="top-right"><div class="streak">🔥 <span id="streak">0</span> ngày liên tiếp</div><div class="avatar" id="avatar">T</div></div></header>
    <div class="content" id="app"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="js/app.js" defer></script>
</body>
</html>
